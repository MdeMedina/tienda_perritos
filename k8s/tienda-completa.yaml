# ==========================================
# 1. BASE DE DATOS (MYSQL)
# ==========================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp2 # <--- Inyectado para forzar la entrega del volumen EBS en AWS Academy
  resources:
    requests:
      storage: 1Gi 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: DOCKER_USERNAME/tienda-db:latest
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "admin123"
        - name: MYSQL_DATABASE
          value: "tienda_perritos"
        - name: MYSQL_USER
          value: "alumno"
        - name: MYSQL_PASSWORD
          value: "alumno123"
        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql
      volumes:
      - name: mysql-storage
        persistentVolumeClaim:
          claimName: mysql-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
spec:
  selector:
    app: mysql
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306

---
# ==========================================
# 2. BACKEND (EXPRESS)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: DOCKER_USERNAME/tienda-backend:latest
        ports:
        - containerPort: 3001
        env:
        - name: DB_HOST
          value: "mysql-service" # CoreDNS resolverá este nombre apuntando al pod de MySQL
        - name: DB_USER
          value: "alumno"
        - name: DB_PASSWORD
          value: "alumno123"
        - name: DB_NAME
          value: "tienda_perritos"
        - name: DB_PORT
          value: "3306"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001

---
# ==========================================
# 3. FRONTEND (NGINX)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: DOCKER_USERNAME/tienda-frontend:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: LoadBalancer # Crea el balanceador de carga público en AWS de forma nativa
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80